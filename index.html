<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartGP — Private online weight loss service</title>
<meta name="description" content="SmartGP is a private online weight loss clinic for UK patients. Book a video consultation with a UK-registered clinician. Prescription medicines are supplied by SmartRx pharmacy following clinical assessment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   SmartGP design system
   Palette carried from SmartRx: pine ink, clinic teal, mint surface.
   Display: Fraunces (optical serif) · Body: Public Sans · Data: IBM Plex Mono
   ========================================================================== */

:root{
  --ink:#0B1F1A;
  --ink-2:#3D544E;
  --ink-3:#6C817B;
  --teal:#0E8C7F;
  --teal-deep:#075F56;
  --teal-soft:#7FC9BF;
  --mint:#E9F4F1;
  --mint-2:#F4FAF8;
  --paper:#FCFCFA;
  --line:#DCE6E2;
  --line-2:#EEF3F1;
  --flag:#A9531D;
  --flag-bg:#FCF1E7;
  --stop:#8E2C2C;
  --stop-bg:#FBEDED;
  --ok:#1E7A4A;
  --ok-bg:#EAF5EF;

  --r-s:6px; --r-m:12px; --r-l:20px; --r-xl:32px;
  --sp:8px;
  --shadow-s:0 1px 2px rgba(11,31,26,.06), 0 4px 14px rgba(11,31,26,.05);
  --shadow-m:0 2px 6px rgba(11,31,26,.06), 0 18px 44px rgba(11,31,26,.09);
  --wrap:1180px;

  --f-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:var(--teal-deep);text-underline-offset:3px}
button{font:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}

.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:12px 18px;z-index:200}
.skip:focus{left:8px;top:8px}

.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* ---------- Type scale ---------- */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em;margin:0 0 .4em;line-height:1.12}
h1{font-size:clamp(2.4rem,5.4vw,4.1rem)}
h2{font-size:clamp(1.85rem,3.4vw,2.7rem)}
h3{font-size:clamp(1.25rem,2vw,1.6rem)}
h4{font-size:1.08rem;font-family:var(--f-body);font-weight:700;letter-spacing:0}
p{margin:0 0 1em}
.lead{font-size:1.18rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-3)}
.small{font-size:.87rem}
.eyebrow{
  font-family:var(--f-mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--teal-deep);margin:0 0 14px;display:flex;align-items:center;gap:10px
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--teal-soft)}
.ref{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);letter-spacing:.04em}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 24px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;
  transition:transform .16s ease,background .16s ease,color .16s ease,border-color .16s ease;
}
.btn:active{transform:translateY(1px)}
.btn-solid{background:var(--teal);color:#fff}
.btn-solid:hover{background:var(--teal-deep)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-deep)}
.btn-quiet{background:var(--mint);color:var(--teal-deep)}
.btn-quiet:hover{background:#DCEDE8}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#16332B}
.btn-sm{padding:8px 15px;font-size:.85rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- Chrome ---------- */
.topbar{background:var(--ink);color:#CFE3DD;font-size:.8rem}
.topbar-in{display:flex;align-items:center;gap:14px;height:38px;overflow:hidden}
.topbar-mark{font-weight:700;color:#fff;letter-spacing:.02em}
.topbar-sep{width:1px;height:14px;background:#33534B}
.topbar-txt{color:#9FBDB5}
.topbar-link{margin-left:auto;color:#fff;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}

.header{position:sticky;top:0;z-index:90;background:rgba(252,252,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.header-in{display:flex;align-items:center;gap:28px;height:76px}
.logo{display:flex;align-items:center;text-decoration:none;font-family:var(--f-display);font-size:1.55rem;font-weight:600;letter-spacing:-.03em}
.logo-dot{width:11px;height:11px;border-radius:50%;background:var(--teal);margin-right:7px;margin-bottom:14px}
.logo-a{color:var(--ink)}
.logo-b{color:var(--teal);font-weight:400}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{
  padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);
  font-weight:500;font-size:.94rem;transition:background .15s,color .15s
}
.nav a:hover{background:var(--mint);color:var(--ink)}
.nav a.on{color:var(--teal-deep);background:var(--mint)}
.header-cta{margin-left:auto;display:flex;gap:10px;align-items:center}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;flex-direction:column;gap:4px;align-items:center;justify-content:center;cursor:pointer}
.burger span{width:17px;height:1.5px;background:var(--ink);display:block}
.mobilenav{border-top:1px solid var(--line-2);background:#fff;padding:10px 24px 20px}
.mobilenav a{display:block;padding:12px 4px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink);font-weight:500}

@media (max-width:1000px){
  .nav{display:none}
  .burger{display:flex}
  .header-cta .btn-ghost{display:none}
  .topbar-txt{display:none}
}

/* ---------- Sections ---------- */
.sec{padding:88px 0}
.sec-tight{padding:56px 0}
.sec-mint{background:var(--mint-2);border-block:1px solid var(--line-2)}
.sec-ink{background:var(--ink);color:#DCEAE6}
.sec-ink h2,.sec-ink h3{color:#fff}
.sec-ink .lead{color:#A8C4BD}
.sec-ink .eyebrow{color:var(--teal-soft)}
.sec-ink .eyebrow::before{background:#33534B}
.sechead{max-width:64ch;margin-bottom:44px}
@media (max-width:700px){.sec{padding:56px 0}}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(1100px 520px at 78% -8%, #DCF0EB 0%, rgba(220,240,235,0) 62%),
  linear-gradient(180deg,#F7FBF9 0%, var(--paper) 100%)}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:86px 0 96px}
.hero h1{margin-bottom:18px}
.hero h1 em{font-style:italic;color:var(--teal-deep)}
.hero-sub{font-size:1.24rem;color:var(--ink-2);max-width:44ch;margin-bottom:30px}
.hero-marks{display:flex;gap:26px;flex-wrap:wrap;margin-top:38px;padding-top:26px;border-top:1px solid var(--line)}
.hero-mark{font-size:.84rem;color:var(--ink-2);max-width:190px}
.hero-mark b{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-deep);margin-bottom:4px}

/* hero card: the appointment card, not a stock photo */
.heroCard{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-m);padding:28px;position:relative}
.heroCard::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--teal-soft);border-radius:var(--r-xl);z-index:-1;opacity:.5}
.heroCard-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.heroCard-h span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.heroStep{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line-2)}
.heroStep:first-of-type{border-top:0}
.heroStep i{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--teal-deep);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-style:normal;font-weight:500
}
.heroStep b{display:block;font-size:.95rem}
.heroStep p{margin:0;font-size:.85rem;color:var(--ink-3)}
.heroStep.is-off{opacity:.42}
.heroStep.is-off i{background:#F1F4F3;color:var(--ink-3)}
@media (max-width:900px){.hero-in{grid-template-columns:1fr;padding:52px 0 64px}.heroCard::after{display:none}}

/* ---------- Cards & grids ---------- */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:940px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:26px;transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease}
.card-link:hover{box-shadow:var(--shadow-m);transform:translateY(-3px);border-color:var(--teal-soft)}
.card h3{margin-bottom:8px}
.card p{color:var(--ink-2);font-size:.95rem}

/* treatment card */
.tcard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.tcard-top{padding:24px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tcard-body{padding:14px 24px 0;flex:1}
.tcard-body p{font-size:.94rem;color:var(--ink-2)}
.tcard-foot{padding:18px 24px 24px;border-top:1px solid var(--line-2);margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tcard-price{font-family:var(--f-display);font-size:1.5rem}
.tcard-price small{font-family:var(--f-body);font-size:.78rem;color:var(--ink-3);display:block;font-weight:500}
.strengths{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.strength{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);background:var(--mint-2)}
.strength.off{opacity:.5;text-decoration:line-through}

.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.74rem;font-weight:600;letter-spacing:.02em}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-off{background:#F1F4F3;color:var(--ink-3)}
.tag-flag{background:var(--flag-bg);color:var(--flag)}
.tag-stop{background:var(--stop-bg);color:var(--stop)}
.tag-teal{background:var(--mint);color:var(--teal-deep)}

/* ---------- Comparison table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:#fff}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th,td{text-align:left;padding:15px 18px;border-bottom:1px solid var(--line-2);vertical-align:top}
thead th{background:var(--mint-2);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-mono);font-weight:500;color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td b{font-weight:600}

/* ---------- Footer ---------- */
.footer{background:var(--ink);color:#9FBDB5;padding:70px 0 30px;font-size:.9rem;margin-top:0}
.footer h4{color:#fff;font-size:.76rem;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px;font-weight:500}
.footer a{color:#CFE3DD;text-decoration:none;display:block;padding:5px 0}
.footer a:hover{color:#fff;text-decoration:underline}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}
@media (max-width:880px){.foot-grid{grid-template-columns:1fr 1fr}}
.foot-reg{margin-top:44px;padding-top:26px;border-top:1px solid #24413A;font-size:.8rem;line-height:1.75;color:#82A49C}
.foot-reg b{color:#CFE3DD}
.emergency-strip{background:#2A1414;color:#F0CFCF;padding:12px 0;font-size:.85rem}
.emergency-strip b{color:#fff}

/* ---------- Journey shell (the signature) ---------- */
.journey{display:grid;grid-template-columns:268px 1fr;gap:52px;align-items:start;padding:48px 0 96px}
@media (max-width:960px){.journey{grid-template-columns:1fr;gap:26px;padding-top:22px}}

.rail{position:sticky;top:100px}
.rail h4{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:18px}
.rail-list{list-style:none;margin:0;padding:0;position:relative}
.rail-list::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:1px;background:var(--line)}
.rail-item{display:flex;gap:14px;padding:7px 0;align-items:flex-start;position:relative}
.rail-dot{
  flex:none;width:23px;height:23px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3);z-index:1
}
.rail-txt{font-size:.88rem;color:var(--ink-3);line-height:1.4;padding-top:2px}
.rail-item.done .rail-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.rail-item.done .rail-txt{color:var(--ink-2)}
.rail-item.now .rail-dot{background:#fff;border-color:var(--teal);border-width:2px;color:var(--teal-deep);font-weight:500;box-shadow:0 0 0 4px var(--mint)}
.rail-item.now .rail-txt{color:var(--ink);font-weight:600}
/* branch glyph marks where the flow diverges per treatment */
.rail-item.branch .rail-txt::after{
  content:"branches by treatment";display:block;font-family:var(--f-mono);font-size:.62rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-top:2px
}
.rail-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-3)}

.rail-mobile{display:none}
@media (max-width:960px){
  .rail{position:static}
  .rail-list,.rail-foot{display:none}
  .rail-mobile{display:block}
  .bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--teal);transition:width .3s ease}
}

.step{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:38px 40px;box-shadow:var(--shadow-s);max-width:760px}
@media (max-width:700px){.step{padding:24px 20px;border-radius:var(--r-l)}}
.step h2{font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:6px}
.step-why{background:var(--mint-2);border-left:3px solid var(--teal-soft);padding:14px 18px;border-radius:0 var(--r-m) var(--r-m) 0;font-size:.9rem;color:var(--ink-2);margin:0 0 26px}
.step-nav{display:flex;gap:12px;align-items:center;margin-top:34px;padding-top:24px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.step-nav .spacer{flex:1}

/* ---------- Forms ---------- */
.field{margin-bottom:22px}
.field > label,.field-label{display:block;font-weight:600;font-size:.97rem;margin-bottom:6px}
.field .hint{font-size:.85rem;color:var(--ink-3);margin:0 0 9px}
.req{color:var(--stop);font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:#fff;
  font:inherit;font-size:.97rem;color:var(--ink);transition:border-color .15s,box-shadow .15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--mint)}
textarea{min-height:110px;resize:vertical}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236C817B' stroke-width='1.6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media (max-width:600px){.row2,.row3{grid-template-columns:1fr}}

.opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border:1px solid var(--line);
  border-radius:var(--r-m);margin-bottom:9px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s
}
.opt:hover{border-color:var(--teal-soft);background:var(--mint-2)}
.opt input{margin-top:4px;flex:none;accent-color:var(--teal);width:17px;height:17px}
.opt.sel{border-color:var(--teal);background:var(--mint-2);box-shadow:0 0 0 1px var(--teal)}
.opt b{font-weight:600;font-size:.96rem;display:block}
.opt span{font-size:.85rem;color:var(--ink-3)}
.opt-inline{display:flex;gap:9px;flex-wrap:wrap}
.opt-inline .opt{margin:0;flex:1;min-width:120px}

.err{color:var(--stop);font-size:.86rem;margin-top:6px;font-weight:500}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--stop);box-shadow:0 0 0 3px var(--stop-bg)}
.formerr{background:var(--stop-bg);border:1px solid #E9C4C4;color:var(--stop);padding:14px 18px;border-radius:var(--r-m);margin-bottom:22px;font-size:.9rem}
.formerr ul{margin:6px 0 0;padding-left:18px}

/* notices */
.notice{border-radius:var(--r-m);padding:16px 20px;font-size:.92rem;margin:0 0 22px;border:1px solid}
.notice-info{background:var(--mint-2);border-color:#CDE5DF;color:var(--ink-2)}
.notice-flag{background:var(--flag-bg);border-color:#EFD5BE;color:#6B3512}
.notice-stop{background:var(--stop-bg);border-color:#E9C4C4;color:var(--stop)}
.notice-ok{background:var(--ok-bg);border-color:#C4E2D0;color:#12522F}
.notice b{display:block;margin-bottom:3px}

/* emergency panel — scrolled past, never dismissible */
.emergency{border:2px solid #E4BFBF;background:#fff;border-radius:var(--r-l);padding:26px 28px;margin-bottom:26px}
.emergency h3{color:var(--stop);font-family:var(--f-body);font-weight:700;font-size:1.12rem}
.emergency ul{margin:12px 0 16px;padding-left:20px;font-size:.92rem;color:var(--ink-2)}
.emergency li{margin-bottom:5px}
.emergency .nhs{background:var(--stop-bg);padding:12px 16px;border-radius:var(--r-m);font-size:.9rem;color:var(--stop);font-weight:500}

/* BMI readout */
.bmi{display:flex;align-items:center;gap:20px;background:var(--mint-2);border:1px solid #CDE5DF;border-radius:var(--r-l);padding:20px 24px;margin:6px 0 22px;flex-wrap:wrap}
.bmi-num{font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--teal-deep)}
.bmi-num small{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.bmi-txt{font-size:.9rem;color:var(--ink-2);max-width:44ch}

/* upload */
.upload{border:2px dashed var(--line);border-radius:var(--r-l);padding:28px;text-align:center;background:var(--mint-2)}
.upload.has{border-style:solid;border-color:var(--teal-soft);background:#fff;text-align:left;display:flex;gap:16px;align-items:center}
.upload-thumb{width:76px;height:52px;border-radius:8px;background:var(--mint);display:grid;place-items:center;font-family:var(--f-mono);font-size:.62rem;color:var(--teal-deep);flex:none;overflow:hidden}
.upload-thumb img{width:100%;height:100%;object-fit:cover}

/* ---------- Slot picker ---------- */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:760px){.slots{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.slots{grid-template-columns:repeat(2,1fr)}}
.slotday{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:#fff}
.slotday-h{background:var(--mint-2);padding:10px;text-align:center;border-bottom:1px solid var(--line-2)}
.slotday-h b{display:block;font-size:.9rem}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtDate(d, opts) {
  return new Intl.DateTimeFormat('en-GB', opts || { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).format(d);
}
function fmtTime(d) {
  return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/London' }).format(d);
}
function ageFrom(dob) {
  if (!dob) return null;
  const b = new Date(dob); if (isNaN(b)) return null;
  const n = new Date(); let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}
function bmiOf(cm, kg) {
  if (!cm || !kg) return null;
  const b = kg / Math.pow(cm / 100, 2);
  return isFinite(b) && b > 5 && b < 120 ? Math.round(b * 10) / 10 : null;
}

/* -------------------------------- router --------------------------------- */
const ROUTES = [];
const route = (pattern, fn) => ROUTES.push({ pattern, fn });
const go = hash => { location.hash = hash; };

function currentPath() {
  const h = location.hash.replace(/^#/, '');
  return h && h !== '/' ? h : '/';
}

function resolve(path) {
  for (const r of ROUTES) {
    if (r.pattern === path) return { fn: r.fn, params: [] };
    if (r.pattern.includes(':')) {
      const pp = r.pattern.split('/'), ap = path.split('/');
      if (pp.length !== ap.length) continue;
      const params = []; let ok = true;
      for (let i = 0; i < pp.length; i++) {
        if (pp[i].startsWith(':')) params.push(decodeURIComponent(ap[i]));
        else if (pp[i] !== ap[i]) { ok = false; break; }
      }
      if (ok) return { fn: r.fn, params };
    }
  }
  return null;
}

function render() {
  const path = currentPath();
  const m = resolve(path);
  const main = $('#main');
  main.innerHTML = m ? m.fn.apply(null, m.params) : notFound(path);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'auto' : 'auto' });
  paintNav(path);
  if (m && m.fn.after) m.fn.after.apply(null, m.params);
  main.focus({ preventScroll: true });
}

function notFound(path) {
  return section(`
    <p class="eyebrow">404</p>
    <h1>That page has moved</h1>
    <p class="lead">There is nothing at <code class="ref">${esc(path)}</code>. Try the treatments directory, or the click-through map if you are reviewing the build.</p>
    <div class="btnrow"><a class="btn btn-solid" href="#/treatments">See treatments</a><a class="btn btn-ghost" href="#/flow">Click-through map</a></div>
  `);
}

function section(inner, cls) {
  return `<section class="sec ${cls || ''}"><div class="wrap">${inner}</div></section>`;
}
function pageHead(eyebrow, title, lead, crumb) {
  return `
    ${crumb ? `<p class="crumb">${crumb}</p>` : ''}
    <p class="eyebrow">${esc(eyebrow)}</p>

}

/* ============================ FORM ENGINE ==================================
   Fields are data. `showIf` drives the dynamic flow (FR-CON-09), `flag`
   marks an answer for clinician attention (BR-22) and never blocks anyone.
   ========================================================================== */

function visible(f, v) {
  if (!f.showIf) return true;
  const cur = v[f.showIf.k];
  if (f.showIf.is !== undefined) return cur === f.showIf.is;
  if (f.showIf.in) return f.showIf.in.indexOf(cur) > -1;
  return true;
}

function visibleFields(fields, v) { return fields.filter(f => visible(f, v)); }

function dependencyKeys(fields) {
  const s = new Set();
  fields.forEach(f => { if (f.showIf) s.add(f.showIf.k); });
  return s;
}

const GP_PRACTICES = [
  { n: 'Rusholme Health Centre', t: '0161 000 0001', e: 'admin@rusholmehc.nhs.uk' },
  { n: 'Bridge Street Surgery', t: '0117 000 0002', e: 'reception@bridgestreet.nhs.uk' },
  { n: 'Headingley Medical Practice', t: '0113 000 0003', e: 'contact@headingleymp.nhs.uk' },
  { n: 'Kelvin Park Practice', t: '0141 000 0004', e: 'info@kelvinpark.nhs.uk' }
];

function renderField(f, v) {
  const val = v[f.k];
  const id = 'f_' + f.k;
  const bad = v.__errors && v.__errors[f.k];
  const lab = `<label class="field-label" for="${id}">${esc(f.label)}${f.required ? ' <span class="req" title="Required">*</span>' : ''}</label>`;
  const hint = f.hint ? `<p class="hint">${esc(f.hint)}</p>` : '';
  const errHtml = bad ? `<p class="err">${esc(bad)}</p>` : '';
  const open = `<div class="field ${bad ? 'bad' : ''}" data-field="${f.k}">`;
  const close = `${errHtml}</div>`;

  switch (f.type) {
    case 'radio':
      return `${open}<span class="field-label">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</span>${hint}
        <div role="radiogroup" aria-label="${esc(f.label)}">
        ${f.options.map((o, i) => `
          <label class="opt ${val === o ? 'sel' : ''}">
            <input type="radio" name="${f.k}" data-k="${f.k}" value="${esc(o)}" ${val === o ? 'checked' : ''}>
            <b>${esc(o)}</b>
          </label>`).join('')}
        </div>${close}`;

    case 'checkboxes': {
      const arr = Array.isArray(val) ? val : [];
      return `${open}<span class="field-label">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</span>${hint}
        ${f.options.map(o => `
          <label class="opt ${arr.indexOf(o) > -1 ? 'sel' : ''}">
            <input type="checkbox" data-k="${f.k}" data-multi="1" ${f.exclusive ? `data-exclusive="${esc(f.exclusive)}"` : ''} value="${esc(o)}" ${arr.indexOf(o) > -1 ? 'checked' : ''}>
            <b>${esc(o)}</b>
          </label>`).join('')}${close}`;
    }

    case 'consent':
      return `${open}
        <label class="opt ${val ? 'sel' : ''}">
          <input type="checkbox" data-k="${f.k}" data-bool="1" ${val ? 'checked' : ''}>
          <b style="font-weight:500">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</b>
        </label>${close}`;

    case 'textarea':
      return `${open}${lab}${hint}<textarea id="${id}" data-k="${f.k}" placeholder="${esc(f.placeholder || '')}">${esc(val || '')}</textarea>${close}`;

    case 'select':
      return `${open}${lab}${hint}<select id="${id}" data-k="${f.k}">
        <option value="">Please choose</option>
        ${f.options.map(o => `<option ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>${close}`;

    case 'postcode':
      return `${open}${lab}${hint}
        <div style="display:flex;gap:10px">
          <input id="${id}" type="text" data-k="${f.k}" value="${esc(val || '')}" placeholder="M1 4BT" style="flex:1">
          <button type="button" class="btn btn-quiet" data-action="postcode">Find address</button>
        </div>
        <p class="hint" style="margin-top:8px">UK postcodes only. Non-UK addresses cannot be accepted (BR-02).</p>${close}`;

    case 'gplookup':
      return `${open}${lab}${hint}
        <div style="display:flex;gap:10px">
          <input id="${id}" type="text" data-k="${f.k}" value="${esc(val || '')}" placeholder="Practice name, postcode or town" style="flex:1">
          <button type="button" class="btn btn-quiet" data-action="gplookup">Search</button>
        </div>
        ${v.__gpDetail ? `<p class="hint" style="margin-top:8px">${esc(v.__gpDetail)}</p>` : ''}${close}`;

    case 'file':
      return `${open}${lab}${hint}
        <div class="upload ${val ? 'has' : ''}" data-upload="${f.k}">
          ${val
            ? `<div class="upload-thumb">${esc((val.split('.').pop() || 'DOC').toUpperCase())}</div>
               <div style="flex:1"><b>${esc(val)}</b><p class="hint" style="margin:2px 0 0">Stored in encrypted private storage. Deleted 30 days after verification.</p></div>
               <button type="button" class="btn btn-ghost btn-sm" data-action="reupload" data-k="${f.k}">Replace</button>`
            : `<p style="margin:0 0 12px" class="muted">JPG, PNG or PDF, up to 10 MB. Make sure all four corners are visible.</p>
               <button type="button" class="btn btn-quiet" data-action="upload" data-k="${f.k}">Choose file</button>`}
        </div>${close}`;

    case 'number':
      return `${open}${lab}${hint}<input id="${id}" type="number" inputmode="decimal" data-k="${f.k}" value="${esc(val || '')}" placeholder="${esc(f.placeholder || '')}">${close}`;

    default:
      return `${open}${lab}${hint}<input id="${id}" type="${f.type === 'date' ? 'date' : f.type === 'email' ? 'email' : f.type === 'tel' ? 'tel' : 'text'}" data-k="${f.k}" value="${esc(val || '')}" placeholder="${esc(f.placeholder || '')}">${close}`;
  }
}

/* Consecutive `half` fields pair up into a two-column row. */
function renderFields(fields, v) {
  const vis = visibleFields(fields, v);
  let out = '', buf = [];
  const flush = () => {
    if (!buf.length) return;
    out += buf.length > 1 ? `<div class="row2">${buf.join('')}</div>` : buf[0];
    buf = [];
  };
  vis.forEach(f => {
    if (f.half) { buf.push(renderField(f, v)); if (buf.length === 2) flush(); }
    else { flush(); out += renderField(f, v); }
  });
  flush();
  return out;
}

function validateFields(fields, v) {
  const errors = {};
  visibleFields(fields, v).forEach(f => {
    if (!f.required) return;
    const val = v[f.k];
    const empty = val === undefined || val === null || val === '' ||
      (Array.isArray(val) && val.length === 0) || (f.type === 'consent' && !val);
    if (empty) errors[f.k] = f.type === 'consent' ? 'You need to tick this to continue.' : 'This answer is needed before you can continue.';
    else if (f.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(val)) errors[f.k] = 'Enter an email address in the format name@example.co.uk';
    else if (f.type === 'tel' && !/^0[0-9\s]{9,13}$/.test(String(val).replace(/\s/g, '') ? String(val) : '')) errors[f.k] = 'Enter a UK mobile number, for example 07700 900000';
    else if (f.type === 'postcode' && !/^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(String(val).trim())) errors[f.k] = 'Enter a full UK postcode, for example M1 4BT';
  });
  return errors;
}

/* Which answers a clinician needs to see first. Never a decision. */
function flagsFor(fields, v) {
  const out = [];
  visibleFields(fields, v).forEach(f => {
    if (!f.flag) return;
    const val = v[f.k];
    let hit = false;
    if (f.flag.when) hit = f.flag.when.indexOf(val) > -1;
    if (f.flag.whenAnyExcept) hit = Array.isArray(val) && val.some(x => x !== f.flag.whenAnyExcept);
    if (hit) out.push({ k: f.k, label: f.label, answer: Array.isArray(val) ? val.join(', ') : val, level: f.flag.level, note: f.flag.note });
  });
  return out;
}

/* Reads the current DOM back into the answer object. */
function collect(root, v) {
  $$('[data-k]', root).forEach(el => {
    const k = el.getAttribute('data-k');
    if (el.type === 'radio') { if (el.checked) v[k] = el.value; }
    else if (el.dataset.multi) {
      const arr = Array.isArray(v[k]) ? v[k].slice() : [];
      const i = arr.indexOf(el.value);
      if (el.checked && i === -1) arr.push(el.value);
      if (!el.checked && i > -1) arr.splice(i, 1);
      v[k] = arr;
    }
    else if (el.dataset.bool) v[k] = !!el.checked;
    else if (el.type !== 'checkbox') v[k] = el.value;
  });
  return v;
}

document.addEventListener('click', e => {
  const sub = e.target.closest('[data-action="subscribe"]');
  if (sub) {
    const input = sub.parentElement.querySelector('input');
    const v = (input.value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)) { toast('Enter an email address in the format name@example.co.uk'); input.focus(); return; }
    S.subscribers.push({ email: v, at: new Date(), source: currentPath(), consent: 'Explicit opt-in' });
    audit('Newsletter subscription', v, 'Marketing consent captured with timestamp');
    input.value = '';
    toast('Subscribed. Marketing consent recorded separately from service messages.');
    return;
  }

  const enq = e.target.closest('[data-action="enquiry"]');
  if (enq) {
    const n = $('#cn').value.trim(), em = $('#ce').value.trim(), t = $('#ct').value, m = $('#cm').value.trim();
    if (!n || !em || !t || !m) { toast('Fill in your name, email, topic and message.'); return; }
    S.enquiries.unshift({ from: n, subject: t, when: 'Just now', status: 'New' });
    audit('Contact enquiry submitted', n, t);
    modal(`<h3>Enquiry sent</h3><p>Thanks ${esc(n)} — it is in the clinic inbox and someone will reply to ${esc(em)} within one working day.</p>
      <p class="small muted">If this becomes urgent before then, call NHS 111. In an emergency, call 999.</p>
      <div class="btnrow"><button class="btn btn-solid" data-close-modal>Close</button><a class="btn btn-ghost" href="#/admin/enquiries" data-close-modal>See it in admin</a></div>`);
    $('#cn').value = ''; $('#ce').value = ''; $('#ct').value = ''; $('#cm').value = '';
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-action="faqsearch"]')) {
    const q = e.target.value.toLowerCase().trim();
    $$('#faqlist .faq').forEach(d => { d.style.display = !q || d.dataset.q.includes(q) ? '' : 'none'; });
    $$('#faqlist h3').forEach(h => {
      let n = h.nextElementSibling, any = false;
      while (n && n.tagName === 'DETAILS') { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; }
      h.style.display = any ? '' : 'none';
    });
  }
});

;
/* ============================================================================
   SmartGP — pre-consultation journey
   The shape of this flow is the whole product: it narrows from a broad screen,
   diverges into treatment-specific questions, then converges into a common set
   of confirmations before the account is created. (Appendix B, Figure 1)
   ============================================================================ */

const STAGES = [
  { id: 'age', label: 'Your age', route: '#/start' },
  { id: 'status', label: 'Where you are now', route: '#/journey/status' },
  { id: 'select', label: 'Choose a treatment', route: '#/journey/select' },
  { id: 'info', label: 'About the treatment', route: '#/journey/info', branch: true },
  { id: 'expect', label: 'What to expect', route: '#/journey/expect' },
  { id: 'personal', label: 'About you', route: '#/journey/personal' },
  { id: 'bmi', label: 'Height, weight and BMI', route: '#/journey/bmi' },
  { id: 'identity', label: 'Consent and photo ID', route: '#/journey/identity' },
  { id: 'safety', label: 'Safety questions', route: '#/journey/safety', branch: true },
  { id: 'gp', label: 'Your GP', route: '#/journey/gp' },
  { id: 'confirm', label: 'Confirm and agree', route: '#/journey/confirm' },
  { id: 'account', label: 'Create your account', route: '#/journey/account' },
  { id: 'booking', label: 'Book your appointment', route: '#/journey/booking' }
];

let CURRENT_FIELDS = [];
let CURRENT_DEPS = new Set();

function J() {
  if (!S.journey) S.journey = { serviceId: null, status: null, answers: {}, furthest: 0, startedAt: new Date() };
  return S.journey;
}
function jSvc() { return svc(J().serviceId); }

function journeyShell(stageId, inner) {
  const idx = STAGES.findIndex(s => s.id === stageId);
  J().furthest = Math.max(J().furthest, idx);
  const pct = Math.round(((idx + 1) / STAGES.length) * 100);

  return `
  <div class="wrap journey">
    <aside class="rail">
      <h4>Your consultation</h4>
      <ol class="rail-list">
        ${STAGES.map((s, i) => `
          <li class="rail-item ${i < idx ? 'done' : ''} ${i === idx ? 'now' : ''} ${s.branch ? 'branch' : ''}">
            <span class="rail-dot">${i < idx ? '✓' : i + 1}</span>
            <span class="rail-txt">${i <= J().furthest && i !== idx ? `<a href="${s.route}" style="color:inherit">${esc(s.label)}</a>` : esc(s.label)}</span>
          </li>`).join('')}
      </ol>
      <p class="rail-foot">Answers are saved as you go. You can close this and pick it up on any device.<br><br>
        <a href="#/support">Need help?</a></p>
      <div class="rail-mobile">
        <div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-3)">
          <span>Step ${idx + 1} of ${STAGES.length}</span><span>${pct}%</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <p style="margin:8px 0 0;font-weight:600">${esc(STAGES[idx].label)}</p>
      </div>
    </aside>
    <div class="step">${inner}</div>
  </div>`;
}

function errorSummary(errors) {
  const keys = Object.keys(errors || {});
  if (!keys.length) return '';
  return `<div class="formerr" role="alert" tabindex="-1" id="errsum">
    <b>There ${keys.length === 1 ? 'is 1 answer' : 'are ' + keys.length + ' answers'} to check before you continue</b>
    <ul>${keys.map(k => `<li>${esc(errors[k])}</li>`).join('')}</ul></div>`;
}

function stepNav(nextRoute, backRoute, label) {
  return `<div class="step-nav">
    ${backRoute ? `<a class="btn btn-ghost" href="${backRoute}">Back</a>` : ''}
    <div class="spacer"></div>
    <button class="btn btn-solid" data-action="next" data-next="${nextRoute}">${esc(label || 'Continue')}</button>
  </div>`;
}

function emergencyPanel() {
  const e = DATA.emergency;
  return `<div class="emergency">
    <h3>${esc(e.title)}</h3>
    <p style="font-weight:600;margin:8px 0 0">${esc(e.lead)}</p>
    <p class="small muted" style="margin:10px 0 0">This includes, but is not limited to:</p>
    <ul>${e.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
    <p class="nhs">${esc(e.nhs)}</p>
  </div>`;
}

/* -------------------------------- 1. age --------------------------------- */
function stepAge(serviceId) {
  const j = J();
  if (serviceId) { j.serviceId = serviceId; }
  const a = j.answers;
  const resume = j.furthest > 0;
  CURRENT_FIELDS = [{ k: 'dob', type: 'date', label: 'What is your date of birth?', required: true, hint: 'This must match the photo ID you upload later.' }];
  CURRENT_DEPS = new Set();

  return journeyShell('age', `
    ${resume ? `<div class="notice notice-ok"><b>You have a consultation in progress</b>
      Pick up where you left off, or start again.
      <div class="btnrow" style="margin-top:10px">
        <a class="btn btn-solid btn-sm" href="${STAGES[j.furthest].route}">Resume</a>
        <button class="btn btn-ghost btn-sm" data-action="restart">Start again</button>
      </div></div>` : ''}
    ${emergencyPanel()}
    <h2>First, your age</h2>
    <p class="step-why">This service is for adults aged 18 or over who live in the UK. We ask before anything else so that nobody fills in a long form only to find they cannot be seen here. There is no upper age limit — your clinician reviews your age alongside everything else on the call.</p>
    ${errorSummary(a.__errors)}
    <form data-stepform>${renderFields(CURRENT_FIELDS, a)}</form>
    ${j.serviceId ? `<p class="small muted">Continuing with <b>${esc(jSvc().name)}</b>. You can change this at the next step.</p>` : ''}
    <div class="step-nav"><div class="spacer"></div><button class="btn btn-solid" data-action="agecheck">Continue</button></div>
  `);
}

function pageBlocked(why) {
  const under = why === 'under18';
  return section(`
    <div style="max-width:720px">
      <p class="eyebrow">We cannot continue</p>
      <h1>${under ? 'This service is for adults aged 18 and over' : 'We cannot treat patients over 75 online'}</h1>
      <p class="lead">${under
        ? 'We have not kept any of the answers you started. Nothing has been saved against your name.'
        : 'Weight management in later life needs a fuller review of your other conditions and medicines than an online service can safely provide.'}</p>
      <div class="card" style="margin-top:26px">
        <h4>What to do instead</h4>
        <ul style="padding-left:20px;color:var(--ink-2)">
          ${under
            ? `<li>Speak to your GP practice — they can refer you to NHS weight management support designed for young people.</li>

               <li>If you need to talk to someone, your school nurse or GP can help.</li>`

               <li>Ask about NHS specialist weight management services in your area.</li>
               <li>You are welcome to use our Learn articles and patient resources.</li>`}

      </div>
      <div class="notice notice-stop" style="margin-top:24px"><b>If you need urgent help</b>Call NHS 111. In an emergency, call 999 or go to A&E.</div>
      <div class="btnrow"><a class="btn btn-ghost" href="#/">Back to the homepage</a><a class="btn btn-quiet" href="#/learn">Read our Learn articles</a></div>
    </div>
  `);
}

/* ----------------------------- 2. status --------------------------------- */
function stepStatus() {
  const a = J().answers;
  CURRENT_FIELDS = [{
    k: 'status', type: 'radio', required: true,
    label: 'Where are you with weight loss treatment right now?',
    options: ['I am new to weight loss treatment', 'I have taken it before but stopped', 'I am taking a treatment now and want to continue']
  }];
  CURRENT_DEPS = new Set();
  return journeyShell('status', `
    <h2>Where you are now</h2>
    <p class="step-why">Your answer decides which questions you are asked. Someone already on treatment gets a short check-in rather than the full form.</p>
    ${errorSummary(a.__errors)}
    <form data-stepform>${renderFields(CURRENT_FIELDS, a)}</form>
    ${stepNav('#/journey/select', '#/start')}
  `);
}

/* ---------------------------- 3. selection ------------------------------- */
function stepSelect() {
  const j = J();

function buildSlots() {
  const p = S.booking;
  const now = new Date();
  const first = new Date(now.getTime() + p.leadTimeHours * 3600e3);
  const days = [];
  for (let d = 0; d < p.horizonDays && days.length < 5; d++) {
    const date = new Date(first.getFullYear(), first.getMonth(), first.getDate() + d);
    if (p.workingDays.indexOf(date.getDay()) === -1) continue;
    const iso = date.toISOString().slice(0, 10);
    if (p.closures.indexOf(iso) > -1) continue;
    const times = [];
    const step = p.durationMins + p.bufferMins;
    for (let m = p.hours.from * 60; m + p.durationMins <= p.hours.to * 60; m += step) {
      const t = new Date(date); t.setHours(Math.floor(m / 60), m % 60, 0, 0);
      if (t < first) continue;
      const taken = S.appointments.some(ap => ap.when.getTime() === t.getTime());
      const seeded = ((d * 7 + m) % 11) < 4; // stand-in for existing clinic bookings
      times.push({ t, free: !taken && !seeded });
    }
    if (times.length) days.push({ date, iso, times });
  }
  return days;
}

/* --------------------------- journey listeners --------------------------- */
function saveAndValidate() {
  const a = J().answers;

  const errors = validateFields(CURRENT_FIELDS, a);

document.addEventListener('change', e => {
  if (!e.target.closest('[data-stepform]') && !e.target.closest('#condWrap')) return;
  const a = J().answers;

  // "None of these" clears everything else, and vice versa
  if (e.target.dataset.multi && e.target.dataset.exclusive) {
    const grp = $$(`[data-k="${e.target.dataset.k}"]`);
    if (e.target.checked && e.target.value === e.target.dataset.exclusive) {
      grp.forEach(x => { if (x !== e.target) x.checked = false; });
    } else if (e.target.checked) {
      grp.forEach(x => { if (x.value === e.target.dataset.exclusive) x.checked = false; });
    }
  }

  collect($('#main'), a);

  const k = e.target.getAttribute('data-k');
  if (k && CURRENT_DEPS.has(k)) { render(); return; }
  // keep option cards visually in sync without a full repaint
  $$('.opt').forEach(o => {
    const i = o.querySelector('input');
    if (i) o.classList.toggle('sel', i.checked);
  });
});

document.addEventListener('input', e => {
  if (e.target.closest('#bmiform')) {
    const a = J().answers;
    if (a.__hUnit === 'ft') {
      a.__hFt = $('#hFt').value; a.__hIn = $('#hIn').value;
      a.heightCm = a.__hFt ? Math.round((Number(a.__hFt) * 30.48 + Number(a.__hIn || 0) * 2.54) * 10) / 10 : '';
    } else if ($('#hCm')) a.heightCm = $('#hCm').value;
    if (a.__wUnit === 'st') {
      a.__wSt = $('#wSt').value; a.__wLb = $('#wLb').value;
      a.weightKg = a.__wSt ? Math.round((Number(a.__wSt) * 6.35029 + Number(a.__wLb || 0) * 0.453592) * 10) / 10 : '';
    } else if ($('#wKg')) a.weightKg = $('#wKg').value;
    bmiPaint();
  }
});

document.addEventListener('click', e => {
  const a = J().answers;

  if (e.target.closest('[data-action="restart"]')) {
    S.journey = null; audit('Questionnaire restarted', 'Journey', 'Patient chose to start again'); render(); return;
  }

  /* unit toggles */
  const unit = e.target.closest('[data-unit]');
  if (unit) {
    if (unit.dataset.unit === 'h') a.__hUnit = unit.dataset.val; else a.__wUnit = unit.dataset.val;
    render(); return;
  }

  /* treatment picker */
  const pick = e.target.closest('[data-pick]');
  if (pick) { J().serviceId = pick.dataset.pick; $$('.opt').forEach(o => o.classList.toggle('sel', o.contains(pick))); return; }

  /* age gate */
  if (e.target.closest('[data-action="agecheck"]')) {
    if (!saveAndValidate()) { render(); return; }
    const age = ageFrom(a.dob);
    if (age === null) { a.__errors = { dob: 'Enter your date of birth as a real date.' }; render(); return; }
    audit('Age check completed', 'Journey', `age ${age}`);
    if (age < 18) { S.journey = null; go('#/blocked/under18'); return; }
    go('#/journey/status'); return;
  }

  /* generic continue */
  const nx = e.target.closest('[data-action="next"]');
  if (nx) {
    if (!saveAndValidate()) { render(); const es = $('#errsum'); if (es) es.focus(); return; }
    if (currentPath() === '/journey/select' && !J().serviceId) { toast('Choose a treatment to continue.'); return; }
    go(nx.dataset.next); return;
  }

  /* postcode lookup (stand-in for a UK address service) */
  if (e.target.closest('[data-action="postcode"]')) {
    collect($('#main'), a);
    const pc = (a.postcode || '').trim();
    if (!/^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(pc)) { toast('Enter a full UK postcode first, for example M1 4BT'); return; }
    a.address1 = '14 Marchant House'; a.address2 = 'Wilbraham Road'; a.town = 'Manchester'; a.county = 'Greater Manchester';
    audit('Address looked up', pc.toUpperCase(), 'UK postcode lookup');
    toast('Address found and filled in.'); render(); return;
  }

  /* GP practice lookup */
  if (e.target.closest('[data-action="gplookup"]')) {
    collect($('#main'), a);
    modal(`<h3>Choose your practice</h3><p class="small muted">Searching NHS organisation data for “${esc(a.gpPractice || 'all practices')}”.</p>
      ${GP_PRACTICES.map((p, i) => `
        <button class="opt" style="width:100%;text-align:left" data-gp="${i}">
          <span><b>${esc(p.n)}</b><span>${esc(p.t)} · ${esc(p.e)}</span></span></button>`).join('')}
      <div class="btnrow" style="margin-top:12px"><button class="btn btn-ghost" data-close-modal>Cancel</button></div>`);
    return;
  }
  const gp = e.target.closest('[data-gp]');
  if (gp) {
    const p = GP_PRACTICES[Number(gp.dataset.gp)];
    a.gpPractice = p.n; a.__gpDetail = `${p.n} · ${p.t} · ${p.e}`;
    closeModal(); render(); toast('Practice selected.'); return;
  }

  /* ID upload */
  const up = e.target.closest('[data-action="upload"],[data-action="reupload"]');
  if (up) {
    collect($('#main'), a);
    const k = up.dataset.k;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*,application/pdf';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      a[k] = f ? f.name : 'document.jpg';
      audit('Identity document uploaded', a[k], 'Encrypted private storage · deletion scheduled +30 days');
      render(); toast('Uploaded. Only clinical staff can open this.');
    };
    inp.click();
    return;
  }

  /* submit questionnaire */
  if (e.target.closest('[data-action="submitQ"]')) {
    if (!saveAndValidate()) { render(); return; }
    if (a.pw && a.pw.length < 10) { a.__errors = { pw: 'Use at least 10 characters.' }; render(); return; }
    if (a.pw !== a.pw2) { a.__errors = { pw2: 'The two passwords do not match.' }; render(); return; }
    submitQuestionnaire(); return;
  }

  /* booking */
  const sl = e.target.closest('[data-slot]');
  if (sl) {
    J().slotIso = sl.dataset.slot;
    $$('.slot').forEach(x => x.classList.remove('sel'));
    sl.classList.add('sel');
    const d = new Date(J().slotIso);
    $('#slotpick').innerHTML = `<div class="notice notice-ok" style="margin-top:20px"><b>Held for 10 minutes</b>${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' })} at ${fmtTime(d)}, UK time. Confirm below to book it.</div>`;
    $('[data-action="confirmSlot"]').removeAttribute('aria-disabled');
    return;
  }
  if (e.target.closest('[data-action="moretimes"]')) {
    $$('.slot.more').forEach(x => { x.style.display = ''; });
    e.target.closest('button').remove();
    return;
  }
  if (e.target.closest('[data-action="confirmSlot"]')) {
    if (!J().slotIso) { toast('Choose a time first.'); return; }
    confirmBooking(); return;
  }
});

function submitQuestionnaire() {
  const j = J(), a = j.answers, s = jSvc();
  const b = bmiOf(a.heightCm, a.weightKg);
  const allFields = S.common.personal.concat(S.common.gp, S.common.consent, s ? s.module : []);
  const flags = flagsFor(s ? s.module : [], a);

  S.user = {
    id: nextId('P'), firstName: a.firstName, lastName: a.lastName, email: a.email,
    mobile: a.mobile, dob: a.dob, postcode: a.postcode, prefs: a.prefs || ['Email'],
    marketing: !!a.cMarketing
  };

  const sub = {
    id: nextId('Q'), patient: S.user, service: s ? s.name : '—', serviceId: j.serviceId,
    at: new Date(), bmi: b, answers: JSON.parse(JSON.stringify(a)), fields: allFields,
    flags, status: 'Submitted — awaiting appointment',
    verification: a.verifyMethod, idFile: a.idFile, version: 'v1.0'
  };
  S.submissions.unshift(sub);
  j.submissionId = sub.id;

  S.patients.unshift({
    id: S.user.id, name: `${a.firstName} ${a.lastName}`, email: a.email, dob: a.dob,
    postcode: a.postcode, status: 'Questionnaire submitted', service: sub.service,
    flags: flags.length, submitted: 'Just now'
  });

  audit('Account created', S.user.id, `${a.firstName} ${a.lastName} · verification email sent`);
  audit('Consent recorded', 'Consent register', 'Terms, privacy, clinical assessment' + (a.cMarketing ? ', marketing opt-in' : ''));
  audit('Questionnaire submitted', sub.id, `${sub.service} · BMI ${b} · ${flags.length} answer(s) flagged for the clinician`);
  audit('Clinic notified', sub.id, 'Submission made available for clinician retrieval');

  go('#/journey/booking');
  toast('Submitted. Now choose an appointment time.');
}

function confirmBooking() {
  const j = J(), s = jSvc();
  const when = new Date(j.slotIso);
  const ap = {
    id: nextId('A'), when, service: s ? s.name : '—', serviceId: j.serviceId,
    clinician: S.booking.clinicians[S.appointments.length % S.booking.clinicians.length],
    status: 'Booked', modality: 'Video', location: null,
    patient: S.user ? `${S.user.firstName} ${S.user.lastName}` : 'Guest',
    submissionId: j.submissionId
  };
  S.appointments.unshift(ap);
  audit('Appointment booked', ap.id, `${fmtDate(when)} ${fmtTime(when)} · assigned to ${ap.clinician} internally`);
  audit('Notification sent', ap.id, 'Booking confirmation by email and SMS, calendar invitation attached');

  if (s && s.kind === 'service') {
    modal(`<h3>Pay for your advice-only appointment</h3>
      <p>This is the one thing SmartGP charges for directly, because there is no product order for SmartRx to bill against.</p>
      <div class="card" style="background:var(--mint-2);margin-bottom:16px"><b>${money(s.priceFrom)}</b><p class="small muted" style="margin:2px 0 0">20-minute video appointment. No medicine supplied.</p></div>
      <p class="small muted">Card details are entered in the payment provider's own hosted fields. No card data ever reaches SmartGP systems.</p>
      <div class="btnrow"><button class="btn btn-solid" data-close-modal data-action="fakepay">Pay ${money(s.priceFrom)}</button><button class="btn btn-ghost" data-close-modal>Later</button></div>`);
  }
  go('#/journey/done');
}

/* ------------------------------ listeners -------------------------------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-action="login"]')) {
    requireUser(); toast('Logged in.'); go('#/dashboard'); return;
  }

  const resch = e.target.closest('[data-action="reschedule"]');
  if (resch) {
    const ap = S.appointments.find(x => x.id === resch.dataset.id);
    audit('Appointment reschedule started', ap.id, 'Patient initiated from dashboard');
    S.journey = S.journey || {}; S.journey.rescheduling = ap.id;
    go('#/journey/booking'); toast('Pick a new time. Your original slot is held until you confirm.'); return;
  }

  const canc = e.target.closest('[data-action="cancelap"]');
  if (canc) {
    const ap = S.appointments.find(x => x.id === canc.dataset.id);
    modal(`<h3>Cancel this appointment?</h3>
      <p>${fmtDate(ap.when, { weekday: 'long', day: 'numeric', month: 'long' })} at ${fmtTime(ap.when)}.</p>
      <p class="small muted">No payment was taken at booking, so there is nothing to refund and no cancellation charge. You can rebook whenever you like.</p>
      <div class="btnrow"><button class="btn btn-solid" data-confirm-cancel="${ap.id}">Yes, cancel it</button>
      <button class="btn btn-ghost" data-close-modal>Keep the appointment</button></div>`);
    return;
  }
  const cc = e.target.closest('[data-confirm-cancel]');
  if (cc) {
    const ap = S.appointments.find(x => x.id === cc.dataset.confirmCancel);
    ap.status = 'Cancelled by patient';
    audit('Appointment cancelled', ap.id, 'Cancelled by patient · no charge applied');
    closeModal(); render(); toast('Appointment cancelled. Nothing was charged.'); return;
  }

  if (e.target.closest('[data-action="submitCheckin"]')) {
    const a = S.checkin;
    collect($('#main'), a);
    const errs = validateFields(DATA.checkin, a);
    a.__errors = Object.keys(errs).length ? errs : null;
    if (a.__errors) { render(); return; }
    const flags = flagsFor(DATA.checkin, a);
    const sub = {
      id: nextId('Q'), patient: S.user, service: 'Repeat review', serviceId: null,
      at: new Date(), bmi: null, answers: JSON.parse(JSON.stringify(a)), fields: DATA.checkin,
      flags, status: 'Check-in submitted — awaiting review', version: 'v1.0'
    };
    S.submissions.unshift(sub);
    audit('Repeat check-in submitted', sub.id, `${flags.length} answer(s) flagged for the clinician`);
    S.journey = { serviceId: null, answers: {}, furthest: 12, submissionId: sub.id };
    go('#/journey/booking');
    toast('Check-in sent. Now book your review appointment.');
    return;
  }

  if (e.target.closest('[data-action="sideeffect"]')) {
    const w = $('#se_w').value.trim(), s = $('#se_s').value;
    if (!w || !s) { toast('Describe what happened and how severe it is.'); return; }
    S.sideEffects.unshift({ what: w, severity: s, still: $('#se_d').value, at: new Date() });
    audit('Side effect reported', S.user.id, `${s} — clinic alerted`);
    modal(`<h3>Sent to the clinic</h3>
      <p>A clinician will look at this and contact you. If your symptoms get worse before then, call NHS 111, or 999 in an emergency.</p>
      <p><b>Please also report it to the MHRA Yellow Card scheme.</b> It takes a few minutes and helps protect other patients.</p>
      <div class="btnrow"><button class="btn btn-solid" data-close-modal>Done</button></div>`);
    $('#se_w').value = ''; $('#se_s').value = '';
    return;
  }

  const pref = e.target.closest('[data-pref]');
  if (pref) {
    const u = S.user, k = pref.dataset.pref;
    if (k === 'marketing') { u.marketing = pref.checked; audit('Marketing consent changed', u.id, `opt-in=${u.marketing}`); }
    else {
      const i = u.prefs.indexOf(k);
      if (pref.checked && i === -1) u.prefs.push(k);
      if (!pref.checked && i > -1) u.prefs.splice(i, 1);
      audit('Communication preference changed', u.id, u.prefs.join(', ') || 'none');
    }
    pref.closest('.opt').classList.toggle('sel', pref.checked);
    toast('Preference saved.');
    return;
  }

  if (e.target.closest('[data-action="saveprofile"]')) {
    const u = S.user;
    u.firstName = $('#pf_f').value; u.lastName = $('#pf_l').value;
    u.email = $('#pf_e').value; u.mobile = $('#pf_m').value; u.postcode = $('#pf_p').value;
    audit('Patient profile updated', u.id, 'Self-service change from dashboard');
    render(); toast('Saved.'); return;
  }

  if (e.target.closest('[data-action="dsar"]')) {
    audit('Data subject request raised', S.user.id, 'Copy of data requested — logged for action within statutory timescales');
    modal(`<h3>Request received</h3><p>We will send a copy of everything we hold about you within one month. The request has been logged and will appear in the admin queue.</p>
      <div class="btnrow"><button class="btn btn-solid" data-close-modal>Close</button></div>`); return;
  }
  if (e.target.closest('[data-action="closeacct"]')) {
    audit('Account closure requested', S.user.id, 'Non-clinical data deleted within 30 days; clinical records retained for the statutory period');
    modal(`<h3>Before you close your account</h3>
      <p>Your non-clinical data is deleted within 30 days. Your clinical record is kept for 10 years because we are required to keep it — that is a legal obligation, not a choice.</p>
      <p class="small muted">Any upcoming appointment will be cancelled.</p>
      <div class="btnrow"><button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-dark" data-close-modal>Confirm closure</button></div>`); return;
  }
});

;

function adminSubmission(id) {
  const s = S.submissions.find(x => x.id === id);
  if (!s) return adminShell('#/admin/submissions', `<div class="notice notice-stop">Submission ${esc(id)} not found in this session.</div>`);
  const a = s.answers;
  const flagKeys = s.flags.map(f => f.k);

  const answerRows = visibleFields(s.fields, a).map(f => {
    const v = a[f.k];
    const shown = Array.isArray(v) ? v.join(', ') : (typeof v === 'boolean' ? (v ? 'Agreed' : 'Not agreed') : v);
    if (shown === undefined || shown === '' || shown === null) return '';
    return `<div class="ans ${flagKeys.indexOf(f.k) > -1 ? 'flagged' : ''}"><dt>${esc(f.label)}</dt><dd>${esc(shown)}</dd></div>`;
  }).join('');

  return adminShell('#/admin/submissions', `
    <p class="crumb"><a href="#/admin/submissions">Questionnaires</a> → ${esc(s.id)}</p>
    <h1 style="font-size:2rem">${esc(s.patient ? s.patient.firstName + ' ' + s.patient.lastName : 'Patient')}</h1>
    <p class="muted">${esc(s.service)} · submitted ${fmtDate(s.at)} at ${fmtTime(s.at)} · questionnaire version ${esc(s.version)}</p>

    ${s.flags.length ? `
      <div class="notice notice-flag" style="margin-top:20px">
        <b>${s.flags.length} answer${s.flags.length > 1 ? 's' : ''} need${s.flags.length > 1 ? '' : 's'} your attention first</b>
        <ul style="margin:8px 0 0;padding-left:18px">
          ${s.flags.map(f => `<li><b>${esc(f.level === 'exclusion' ? 'Exclusion' : 'Caution')}:</b> ${esc(f.label)} — answered “${esc(f.answer)}”. ${esc(f.note)}</li>`).join('')}
        </ul>
        <p class="small" style="margin:10px 0 0">Flagging is not a decision. The patient has not been refused and has not been told anything about this.</p>
      </div>` : `<div class="notice notice-ok" style="margin-top:20px"><b>No exclusions or cautions flagged</b>Read the answers in full anyway — the online form is a starting point, not an assessment.</div>`}

    <div class="stats" style="margin-top:22px">
      <div class="stat"><b>${s.bmi || '—'}</b><span>Calculated BMI</span></div>
      <div class="stat"><b>${a.heightCm || '—'}</b><span>Height (cm)</span></div>
      <div class="stat"><b>${a.weightKg || '—'}</b><span>Declared weight (kg)</span></div>
      <div class="stat"><b>${ageFrom(a.dob) || '—'}</b><span>Age</span></div>
    </div>

    <div class="grid g2" style="margin-top:26px;align-items:start">
      <div class="card">
        <h4>Identity document</h4>
        ${a.idFile ? `<p style="margin:6px 0"><b>${esc(a.idType || 'Document')}</b><br><span class="ref">${esc(a.idFile)}</span></p>
          <p class="small muted">Opened through a short-lived signed link. This access has been written to the audit log. Scheduled for deletion 30 days after verification.</p>
          <button class="btn btn-ghost btn-sm" data-action="viewdoc" data-id="${esc(s.id)}">Open document</button>`
          : `<p class="muted">No document on this submission.</p>`}
      </div>
      <div class="card">
        <h4>Weight verification</h4>
        <p style="margin:6px 0"><b>${esc(s.verification || 'Not recorded')}</b></p>
        <p class="small muted">Height and weight must be independently verified before first supply. Confirm it on the call and record it in the clinical system — SmartGP captures the method, you confirm the fact.</p>
      </div>
    </div>

    <h3 style="margin-top:34px">All answers</h3>
    <div style="background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:8px 20px">${answerRows || '<p class="empty">No answers recorded.</p>'}</div>

    <h3 style="margin-top:34px">Record the outcome</h3>

/* ------------------------------ listeners -------------------------------- */
document.addEventListener('change', e => {
  if (e.target.matches('[data-action="role"]')) {
    S.role = e.target.value;
    audit('Role switched', S.role, 'Prototype role simulator');
    render(); toast(`Now viewing as ${S.role}.`); return;
  }
  if (e.target.matches('[data-action="qbservice"]')) { S.qbService = e.target.value; render(); return; }
  if (e.target.matches('[data-param]')) {
    S.booking[e.target.dataset.param] = Number(e.target.value);
    audit('Booking parameter changed', e.target.dataset.param, 'New value ' + e.target.value);
    toast('Booking rule updated. Patients see this immediately.'); return;
  }
  if (e.target.matches('[data-price]')) {
    const [sid, i] = e.target.dataset.price.split(':');
    const s = svc(sid), old = s.strengths[i].price;
    s.strengths[i].price = Number(e.target.value);
    audit('Price changed', `${s.name} ${s.strengths[i].label}`, `${money(old)} → ${money(e.target.value)} · previous price retained against historical records`);
    toast('Price updated and versioned.'); return;
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-action="psearch"]')) {
    const q = e.target.value.toLowerCase().trim();
    $$('#ptbody tr').forEach(r => { r.style.display = !q || r.dataset.row.includes(q) ? '' : 'none'; });
  }
});

document.addEventListener('click', e => {
  const av = e.target.closest('[data-avail]');
  if (av) {
    const [sid, i] = av.dataset.avail.split(':');
    const s = svc(sid);
    s.strengths[i].available = !s.strengths[i].available;
    audit('Availability flag changed', `${s.name} ${s.strengths[i].label}`, s.strengths[i].available ? 'Available' : 'Hidden from patients');
    render(); toast(s.strengths[i].available ? 'Back on sale to patients.' : 'Hidden from the patient journey.'); return;
  }

  const promo = e.target.closest('[data-promo]');
  if (promo) {
    const s = svc(promo.dataset.promo);
    if (s.kind !== 'service') {
      audit('Promotion blocked', s.name, 'Attempted promotion on a prescription-only medicine — refused at the data layer');
      modal(`<h3>Blocked</h3>
        <p><b>${esc(s.name)}</b> is a prescription-only medicine. Promotions cannot be attached to it, referenced against it, or displayed next to it.</p>
        <p class="small muted">This is enforced in the data layer, not just hidden in the interface, so it cannot be worked around by an administrator in a hurry. The attempt has been written to the audit log.</p>
        <div class="btnrow"><button class="btn btn-solid" data-close-modal>Understood</button></div>`);
    } else {
      modal(`<h3>Promotion allowed</h3><p><b>${esc(s.name)}</b> is a service, not a prescription-only medicine, so a promotion may be attached. Every promotion still needs compliance approval before it goes live.</p>
        <div class="btnrow"><button class="btn btn-solid" data-close-modal>Close</button></div>`);
    }
    return;
  }

  const out = e.target.closest('[data-outcome]');
  if (out) {
    const s = S.submissions.find(x => x.id === out.dataset.id);
    const kind = out.dataset.outcome;
    s.outcome = kind;
    if (kind === 'approved') {
      s.outcomeLabel = 'Treatment approved';
      s.outcomeNote = 'Patient notified by email and SMS. SmartRx has been asked to send the payment link. No payment is taken by SmartGP.';
      const strength = s.serviceId ? svc(s.serviceId).strengths.find(x => x.available) : null;
      S.orders.unshift({
        id: nextId('O'), item: `${s.service}${strength ? ' ' + strength.label : ''}`,
        price: strength ? strength.price : 0, at: new Date(), stage: 0, tracking: 'RM' + (900000 + S.orders.length * 7) + 'GB'
      });
      audit('Consultation outcome recorded', s.id, 'Approved — patient notified, SmartRx asked to issue payment link');
    } else if (kind === 'more') {
      s.outcomeLabel = 'More information needed';
      s.outcomeNote = 'Patient asked for the missing information and invited to rebook. Nothing has been refused.';
      audit('Consultation outcome recorded', s.id, 'More information needed — patient notified');
    } else {
      s.outcomeLabel = 'Not suitable';
      s.outcomeNote = 'Patient sent a supportive message with alternatives and signposting to their GP or NHS 111. No payment taken.';
      audit('Consultation outcome recorded', s.id, 'Not suitable — supportive notification with signposting sent');
    }
    const p = S.patients.find(x => s.patient && x.id === s.patient.id);
    if (p) p.status = kind === 'approved' ? 'Approved' : kind === 'more' ? 'Awaiting information' : 'Not suitable';
    audit('Notification sent', s.id, 'Outcome sent by email and SMS');
    render(); toast('Outcome recorded and the patient has been notified.'); return;
  }

  const att = e.target.closest('[data-attend]');
  if (att) {
    const ap = S.appointments.find(x => x.id === att.dataset.attend);
    ap.status = att.dataset.v;
    audit('Attendance recorded', ap.id, att.dataset.v + (att.dataset.v === 'Did not attend' ? ' — rebooking prompt queued' : ''));
    render(); toast('Attendance recorded.'); return;
  }

  const res = e.target.closest('[data-resolve]');
  if (res) { S.enquiries[Number(res.dataset.resolve)].status = 'Resolved'; audit('Enquiry resolved', 'Contact inbox', ''); render(); return; }

  if (e.target.closest('[data-action="addservice"]')) {
    const n = $('#ns_n').value.trim();
    if (!n) { toast('Give the service a name.'); return; }
    S.services.push({
      id: slug(n), kind: 'oral', name: n, strapline: $('#ns_s').value.trim() || 'Clinician reviewed',
      blurb: $('#ns_b').value.trim() || 'Description to follow.', priceFrom: Number($('#ns_p').value || 0),
      published: false, strengths: [{ label: 'Standard', price: Number($('#ns_p').value || 0), available: true }],
      info: { suitable: ['To be supplied by the clinical team'], how: ['To be supplied'], works: ['To be supplied'], other: ['To be supplied'] },
      cautions: ['I will read the patient information leaflet supplied with any medicine.'],
      module: [], approval: { approved: false, by: null, date: null }
    });
    audit('Service created', n, 'Draft — common preliminary set attached automatically');
    render(); toast('Draft created. It cannot be published until its questionnaire module is clinically signed off.'); return;
  }

  const pub = e.target.closest('[data-publish]');
  if (pub) {
    const s = svc(pub.dataset.publish);
    if (!s.approval.approved) {
      audit('Publication blocked', s.name, 'No recorded clinical approval of the questionnaire module');
      modal(`<h3>Cannot publish yet</h3>
        <p><b>${esc(s.name)}</b> has no clinically approved questionnaire module. Publication is gated on a recorded approval — who approved it, and when.</p>
        <p class="small muted">Build the module in the questionnaire builder, then ask the responsible clinician to sign it off.</p>
        <div class="btnrow"><a class="btn btn-solid" href="#/admin/questions" data-close-modal>Open the builder</a>
        <button class="btn btn-ghost" data-signoff="${s.id}" data-close-modal>Record clinical approval</button></div>`);
      return;
    }
    s.published = true;
    audit('Service published', s.name, 'Page, questionnaire and products live together');
    render(); toast('Published. It is live in the Treatments directory now.'); return;
  }
  const so = e.target.closest('[data-signoff]');
  if (so) {
    const s = svc(so.dataset.signoff);
    s.approval = { approved: true, by: 'Rachel Wood', date: new Date().toISOString().slice(0, 10) };
    audit('Clinical approval recorded', s.name, 'Approved by Rachel Wood');
    render(); toast('Clinical approval recorded. You can publish now.'); return;
  }

  const mv = e.target.closest('[data-qmove]');
  if (mv) {
    const [sid, i, d] = mv.dataset.qmove.split(':');
    const m = svc(sid).module, from = Number(i), to = from + Number(d);
    if (to < 0 || to >= m.length) return;
    m.splice(to, 0, m.splice(from, 1)[0]);
    audit('Question reordered', sid, `position ${from + 1} → ${to + 1} · new version created`);
    render(); return;
  }
  const rt = e.target.closest('[data-qretire]');
  if (rt) {
    const [sid, i] = rt.dataset.qretire.split(':');
    const m = svc(sid).module, q = m[Number(i)];
    m.splice(Number(i), 1);
    audit('Question retired', sid, `“${q.label}” · existing submissions still render against the old version`);
    render(); toast('Retired. Submissions already made are untouched.'); return;
  }
  if (e.target.closest('[data-action="addq"]')) {
    const l = $('#nq_l').value.trim();
    if (!l) { toast('Type the question first.'); return; }
    const sid = S.qbService || S.services[1].id;
    const type = $('#nq_t').value, fl = $('#nq_f').value;
    const q = { k: 'q' + Date.now().toString().slice(-5), type, label: l, required: true };
    if (type === 'radio') q.options = ['No', 'Yes', 'I am not sure'];
    if (type === 'checkboxes') q.options = ['Option one', 'Option two', 'None of these'];
    if (fl) q.flag = { when: ['Yes', 'I am not sure'], level: fl, note: fl === 'exclusion' ? 'Marked as an exclusion by the clinical lead' : 'Marked as a caution by the clinical lead' };
    svc(sid).module.push(q);
    audit('Question added', sid, `“${l}” · module version incremented, awaiting clinical sign-off`);
    render(); toast('Added. Try the patient journey — it appears in the safety screen straight away.'); return;
  }

  if (e.target.closest('[data-action="export"]')) {
    audit('Report exported', 'Clinical governance report', 'CSV export containing patient identifiers — permission checked and logged');
    toast('Exported. The export itself is written to the audit log.'); return;
  }

  const doc = e.target.closest('[data-action="viewdoc"]');
  if (doc) {
    audit('Identity document accessed', doc.dataset.id, 'Opened by clinician through a short-lived signed link');
    modal(`<h3>Identity document</h3>
      <div style="height:180px;background:var(--mint);border-radius:12px;display:grid;place-items:center;color:var(--teal-deep);font-family:var(--f-mono);font-size:.8rem">Document preview</div>
      <p class="small muted" style="margin-top:14px">Served from encrypted private storage through a link that expires in 60 seconds. This access has been recorded against your name in the audit log.</p>
      <div class="btnrow"><button class="btn btn-solid" data-close-modal>Close</button></div>`);
    return;
  }

  const stub = e.target.closest('[data-stub]');
  if (stub) { toast(`${stub.dataset.stub} — editor not built in this prototype.`); return; }

  const jump = e.target.closest('[data-jump]');
  if (jump) { const t = $(jump.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth' }); return; }
});

;
